name: Build

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --draft \
            --title "opCA ${{ github.ref_name }}" \
            --notes "See the [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details."

  build:
    needs: [create-release]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            os_name: Apple
            cpu: arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            os_name: Apple
            cpu: x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            os_name: Linux
            cpu: x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            os_name: Windows
            cpu: x64

    runs-on: ${{ matrix.platform }}

    env:
      # cargo resolves the optional, private wslib-ai-mcp even with the mcp feature off;
      # its own fetcher cannot use the agent, git can.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Load the wslib-ai-rs deploy key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.WSLIB_AI_DEPLOYMENT_KEY }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install npm dependencies
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Import Apple certificate
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERT_PATH
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain-db

      - name: Set notarisation credentials
        if: matrix.platform == 'macos-latest' && vars.APPLE_NOTARISE == 'true'
        run: |
          echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> $GITHUB_ENV
          echo "APPLE_PASSWORD=${{ secrets.APPLE_NOTARY_PASSWORD }}" >> $GITHUB_ENV
          echo "APPLE_TEAM_ID=${{ vars.APPLE_TEAM_ID }}" >> $GITHUB_ENV

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        with:
          args: --target ${{ matrix.target }}

      # Release assets are named opCA_<version>_<Platform>_<CPU>.<ext>; the
      # .app bundle and its updater tarball aren't shipped.
      - name: Name installers
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          bundle=target/${{ matrix.target }}/release/bundle
          mkdir -p dist
          shopt -s nullglob
          for file in "$bundle"/dmg/*.dmg "$bundle"/nsis/*.exe "$bundle"/msi/*.msi \
                      "$bundle"/appimage/*.AppImage "$bundle"/deb/*.deb; do
            cp "$file" "dist/opCA_${version}_${{ matrix.os_name }}_${{ matrix.cpu }}.${file##*.}"
          done
          ls -l dist
          [ -n "$(ls dist)" ] || { echo "No installers found under $bundle"; exit 1; }

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" dist/* --clobber

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: opca-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
