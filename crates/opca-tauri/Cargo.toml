[package]
name = "opca-tauri"
version.workspace = true
edition = "2021"
description = "OPCA desktop application — Tauri 2 GUI"

[dependencies]
opca-core = { path = "../opca-core" }
tauri = { version = "2.12", features = [] }
tauri-plugin-clipboard-manager = "2.5"
tauri-plugin-dialog = "2.8"
tauri-plugin-log = "2.10"
tauri-plugin-shell = "2.5"
wslib-tauri = { version = "0.1", registry = "wired-square" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
openssl = "0.10"
dirs = "6"
reqwest = { version = "0.12", features = ["json"] }
rand = "0.9"
base64 = "0.22"
md5 = "0.7"
wslib-crypto-x509 = { version = "0.1.2", registry = "wired-square" }
wslib-crypto-ca = { version = "0.1.1", registry = "wired-square" }
wslib-dns = { version = "0.2.1", registry = "wired-square" }
wslib-mcp = { version = "0.2", registry = "wired-square", features = ["http", "dom", "tauri-bridge"], optional = true }

[dev-dependencies]
opca-core = { path = "../opca-core", features = ["test-support"] }
tauri = { version = "2.12", features = ["test"] }
tempfile = "3"

[features]
# Dev-only MCP server for the UI harness; refused in release builds (see main.rs).
mcp = ["dep:wslib-mcp"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
