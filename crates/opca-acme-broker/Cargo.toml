[package]
name = "opca-acme-broker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The ACME broker daemon that holds an opCA subordinate CA"
publish = false

[package.metadata.deb]
maintainer = "Wired Square <apps@wiredsquare.com>"
copyright = "2026, Wired Square"
license-file = ["../../LICENSE", "0"]
extended-description = """\
Holds an opCA name-constrained subordinate CA, pairs with opCA once, and runs \
step-ca as its child to issue ACME certificates inside the permitted domains."""
section = "net"
priority = "optional"
depends = "$auto, systemd, step-ca (>= 0.28.1)"
conf-files = ["/etc/opca-acme/broker.toml"]
maintainer-scripts = "debian/"
systemd-units = { enable = false, start = false }
assets = [
    ["target/release/opca-acme-broker", "usr/bin/", "755"],
    ["target/release/opca-acme", "usr/bin/", "755"],
    ["debian/broker.toml", "etc/opca-acme/broker.toml", "644"],
    ["debian/opca-acme.sysusers", "usr/lib/sysusers.d/opca-acme.conf", "644"],
]

[dependencies]
rustls = { version = "0.23", default-features = false }
rustls-openssl = { version = "0.4", default-features = false }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", default-features = false, features = ["process", "rt", "signal", "time"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }
tracing = "0.1"
wslib-crypto = { version = "0.1.2", registry = "wired-square" }
wslib-crypto-ca = { version = "0.2.0", registry = "wired-square" }
wslib-crypto-x509 = { version = "0.1.3", registry = "wired-square" }
axum = { version = "0.8", default-features = false }
serde_json = "1"
libc = "0.2"
opca-acme-api = { path = "../opca-acme-api" }
wslib-http-server = { version = "0.1.2", registry = "wired-square" }
wslib-file-atomic = { version = "0.1.5", registry = "wired-square" }
wslib-pairing = { version = "0.1.0", registry = "wired-square" }
wslib-service = { version = "0.1.2", registry = "wired-square" }
wslib-telemetry = { version = "0.1.9", registry = "wired-square", default-features = false, features = ["setup-core"] }
wslib-tls = { version = "0.2.3", registry = "wired-square" }

[dev-dependencies]
opca-core = { path = "../opca-core", features = ["test-support"] }
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread"] }
tokio-rustls = { version = "0.26", default-features = false }
