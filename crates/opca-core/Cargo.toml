[package]
name = "opca-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "OPCA core library — PKI management backed by 1Password"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
gethostname = "1"
log = "0.4"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.33", features = ["bundled", "backup"] }
tempfile = "3"
wslib-file-atomic = { version = "0.1.2", registry = "wired-square" }
shellexpand = "3"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["hmac"] }
sha2 = "0.10"
rand = "0.9"
openssl = { version = "0.10", features = ["vendored"] }
openssl-sys = "0.9"
foreign-types = "0.3"
rustls-openssl = "0.4"
rustls = { version = "0.23", default-features = false }
rustls-pki-types = "1.12"
wslib-crypto = { version = "0.1", registry = "wired-square" }
wslib-crypto-x509 = { version = "0.1.3", registry = "wired-square" }
wslib-crypto-ca = { version = "0.2.0", registry = "wired-square" }
wslib-dns-mail = { version = "0.5.1", registry = "wired-square" }
wslib-1password = { version = "0.1.1", registry = "wired-square" }
# wslib-1password traces each `op` call; this forwards them to `log`.
tracing = { version = "0.1", features = ["log"] }
aws-sdk-s3 = "1"
aws-sdk-route53 = "1"
aws-credential-types = "1"
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread", "time"] }
wslib-dns = { version = "0.2.1", registry = "wired-square", features = ["hickory"] }
ssh2 = "0.9"
dirs = "6"
whoami = "1"
opca-acme-api = { path = "../opca-acme-api" }
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
tokio-rustls = { version = "0.26", default-features = false }
wslib-pairing = { version = "0.1.0", registry = "wired-square" }
wslib-tls = { version = "0.2.2", registry = "wired-square" }

[dev-dependencies]
wslib-1password = { version = "0.1.1", registry = "wired-square", features = ["testing"] }
wslib-dns = { version = "0.2.1", registry = "wired-square", features = ["testing"] }

[features]
default = []
# Exposes `testutil` and the fake `op` to other crates' tests.
test-support = ["wslib-1password/testing"]
