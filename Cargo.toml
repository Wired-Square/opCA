[workspace]
members = ["crates/opca-core", "crates/opca-cli", "crates/opca-tauri", "crates/opca-acme-api", "crates/opca-acme-broker"]
resolver = "3"

[workspace.package]
version = "0.102.4"
edition = "2024"
rust-version = "1.99"

# RSA key generation in pure Rust takes minutes unoptimised.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3
